name: CI

on:
  push:
  pull_request:

env:
  # CI never calls external providers; all tests run against the stub
  RECOMMENDATION_PROVIDER: stub

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - workflow-service
          - decision-service
          - payment-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run health tests
        working-directory: services/${{ matrix.service }}
        run: pytest -q

  verification-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run verification suite
        run: pytest -q tests/verification

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose configuration
        run: docker compose config --quiet
